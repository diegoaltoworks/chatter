name: Feature Request
description: Suggest an idea for Chatter
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature for Chatter!

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like
      placeholder: I'd like to be able to...
    validations:
      required: true

  - type: textarea
    id: seam_tried
    attributes:
      label: Seam tried
      description: Which existing extension point did you try, and what exact error or failure did it produce?
      placeholder: I tried X and got the following error...
    validations:
      required: true

  - type: input
    id: second_caller
    attributes:
      label: Second caller
      description: Name a second caller who is not you and would also use this feature, or state that there is none.
      placeholder: e.g., project Foo at path/to/usage.ts, or "None known"
    validations:
      required: true

  - type: input
    id: verified_against
    attributes:
      label: Verified against
      description: The commit or version of main this evidence was verified against.
      placeholder: e.g., abc1234, or the release tag you tested against
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
