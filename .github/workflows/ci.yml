name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # The gates, exactly as they run locally. Bun is the development runtime, so
  # one leg is the honest number of legs: the old Node matrix ran every version
  # through `bun`, making four identical jobs that proved nothing about Node.
  check:
    name: Gates (Bun)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # typecheck + api-surface compile + lint + test + audit. Running the
      # steps individually let the api-surface compile test drift out of CI.
      - name: Run gates
        run: bun run check

      - name: Build package
        run: bun run build

  # What Node consumers actually get. `engines.node` is the floor tested here.
  node-runtime:
    name: Built package (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      # Loads dist/ the way a Node host does and boots a server from it. Every
      # test above this runs under Bun, where a `Bun` global exists and
      # require() works inside ESM — neither is true here.
      - name: Verify the built package under Node
        run: bun run test:node

  package-contract:
    name: Package contract (packed tarball)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Packs the real tarball and resolves every `exports` key under both
      # import and require. Nothing else catches a subpath whose runtime file
      # no build step produces — `types` resolves, so tsc stays green.
      - name: Verify published exports resolve
        run: bun run test:pack

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile referenced a build script that did not exist, so it had
      # never been built by anything.
      - name: Build image
        run: docker build -t chatter:ci .
