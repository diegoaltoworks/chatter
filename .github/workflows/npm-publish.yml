name: Publish to NPM

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

jobs:
  # A human is in the loop on every release, either by authoring the commit that
  # lands on main or by dispatching this workflow. Dependency bumps do not
  # qualify: dependabot opens the PR, auto-merge lands it, and CI goes green
  # without anyone reading the diff, so publishing off that commit would put an
  # upstream maintainer's code on npm under our name unattended. The bump still
  # ships — with the next human-authored merge, or when someone dispatches this
  # workflow deliberately.
  publish:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push' &&
        !startsWith(github.event.workflow_run.head_commit.message, 'chore(release): v') &&
        github.event.workflow_run.head_commit.author.name != 'dependabot[bot]' &&
        github.event.workflow_run.actor.login != 'dependabot[bot]'
      )

    permissions:
      contents: write
      id-token: write

    env:
      NODE_VERSION: 24.x

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # The job condition only sees the commit that triggered this run, so a
      # dependency bump merged earlier would ride out inside the next person's
      # release with nobody having read it. This scans everything not yet
      # released and stops the automated path dead. A maintainer clears it by
      # reviewing the bump and running this workflow from the Actions tab —
      # dispatching is the approval, and it moves the tag past the bump so
      # ordinary releases resume.
      - name: Refuse to auto-release unreviewed dependency bumps
        if: github.event_name != 'workflow_dispatch'
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          RANGE="${LATEST_TAG:+${LATEST_TAG}..}HEAD"
          if git log "$RANGE" --format='%an' | grep -qxF 'dependabot[bot]'; then
            echo "::error::Unreleased commits authored by dependabot[bot] since ${LATEST_TAG:-the start of history}. Review them, then run this workflow manually to publish."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14


      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The same gates as CI, through the same entry point, so the publish path
      # cannot quietly run a smaller set than a PR does.
      - name: Run gates
        run: bun run check

      - name: Build package
        run: bun run build
      - name: Bump minor version
        id: bump
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$LATEST_TAG" ]; then
            BASE_VERSION="${LATEST_TAG#v}"
          else
            BASE_VERSION=$(node -p "require('./package.json').version")
          fi
          NEW_VERSION=$(node -e "const [major, minor] = process.argv[1].split('.').map(Number); console.log(major + '.' + (minor + 1) + '.0')" "$BASE_VERSION")
          while git rev-parse --verify --quiet "refs/tags/v${NEW_VERSION}" >/dev/null; do
            NEW_VERSION=$(node -e "const [major, minor] = process.argv[1].split('.').map(Number); console.log(major + '.' + (minor + 1) + '.0')" "$NEW_VERSION")
          done
          npm version "$NEW_VERSION" --no-git-tag-version >/dev/null
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and tag version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
