name: Release Watchdog

# Every other guard in the release path is event-driven, so none of them can
# see the failure this one exists for: on 2026-08-16 GitHub stopped creating
# workflow runs for this repository for about seventeen hours, and eleven
# merges landed on main with no CI run, no publish, and nothing red anywhere.
# A schedule is the only trigger that still fires once event delivery comes
# back, which is exactly when someone needs to be told what it missed.
on:
  schedule:
    # Offset off the hour so this is not queued behind the top-of-hour crowd.
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Check the release train is moving
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history plus tags: the check is "what is on main that no tag
      # covers", which a shallow clone cannot answer.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # No `bun install`: scripts/release-drift.ts is dependency-free on
      # purpose, so the watchdog still reports during an install outage.
      - name: Compare main against the registry
        id: drift
        run: bun scripts/release-drift.ts "$(node -p "require('./package.json').name")"

      # One issue, reopened and re-commented rather than duplicated: this runs
      # four times a day, and a stall lasts until someone acts on it.
      - name: Open or update the stranded-release issue
        if: steps.drift.outputs.stalled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.drift.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Release train stalled"
          BODY="${REASON}"$'\n\n'"Detected by the Release Watchdog: ${RUN_URL}"$'\n\n'"To clear it: run the \"Publish to NPM\" workflow from the Actions tab. That path does not depend on the push trigger."
          NUMBER=$(gh issue list --repo "${{ github.repository }}" --state all --limit 50 \
            --json number,title,state --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$NUMBER" ]; then
            gh issue reopen "$NUMBER" --repo "${{ github.repository }}" || true
            gh issue comment "$NUMBER" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

      # Separate from the issue step so the run itself goes red: a failing
      # scheduled workflow emails the repository owner, and an issue on its own
      # does not.
      - name: Fail the run so the stall is visible
        if: steps.drift.outputs.stalled == 'true'
        run: exit 1

      # Closes itself once the train moves again, so the issue is a live
      # signal rather than a stale one someone has to remember to tidy up.
      - name: Close the stranded-release issue once the train moves
        if: steps.drift.outputs.stalled != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.drift.outputs.reason }}
        run: |
          NUMBER=$(gh issue list --repo "${{ github.repository }}" --state open --limit 50 \
            --json number,title --jq '[.[] | select(.title == "Release train stalled")][0].number // empty')
          [ -z "$NUMBER" ] && exit 0
          gh issue close "$NUMBER" --repo "${{ github.repository }}" --comment "Resolved: ${REASON}"
